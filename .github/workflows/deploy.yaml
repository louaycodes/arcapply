name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'services/**'
      - '.github/workflows/deploy.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload code to VPS
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_PORT: ${{ secrets.VPS_PORT }}
        run: |
          rsync -az --delete \
            --exclude '.env' --exclude '.env.*' \
            --exclude 'node_modules' --exclude '.venv' \
            --exclude '.next' --exclude '__pycache__' \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            apps services "$SSH_USER@$SSH_HOST:/opt/arcapply/arcapply/"

      - name: Build and restart on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            cd /opt/arcapply/arcapply/services/engine
            /home/louay/.local/bin/uv sync --no-dev
            /opt/arcapply/arcapply/services/engine/.venv/bin/playwright install chromium || /home/louay/.local/bin/uv run playwright install chromium || true
            cd ../../apps/web
            npm install --no-audit --no-fund
            npm run build
            sudo -n systemctl restart arcapply-engine
            sudo -n systemctl restart arcapply-web