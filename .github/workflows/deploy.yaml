name: Deploy to VPS

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/arcapply/arcapply
            git fetch origin
            git reset --hard origin/main
            cd services/engine
            /home/louay/.local/bin/uv sync --no-dev
            cd ../../apps/web
            npm ci
            npm run build
            sudo -n systemctl restart arcapply-engine
            sudo -n systemctl restart arcapply-web
