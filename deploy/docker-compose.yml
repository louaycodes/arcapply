services:
  engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.engine
    container_name: arcapply-engine
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - ARCAPPLY_DATA_DIR=/root/.arcapply
      - ARCAPPLY_DB_FILENAME=arcapply.db
    volumes:
      - arcapply_data:/root/.arcapply
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - arcapply_net

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        - NEXT_PUBLIC_ENGINE_API_URL=
    container_name: arcapply-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_ENGINE_API_URL=
    depends_on:
      engine:
        condition: service_healthy
    networks:
      - arcapply_net

  nginx:
    image: nginx:alpine
    container_name: arcapply-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - engine
    networks:
      - arcapply_net

volumes:
  arcapply_data:
    name: arcapply_data

networks:
  arcapply_net:
    name: arcapply_net
